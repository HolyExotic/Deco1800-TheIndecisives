<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan a new route</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/routes2-activity-selection.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="top-banner">
            <a class="back-link" href="routes.html" aria-label="Back to routes">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 5l-7 7 7 7" />
                </svg>
            </a>
            <h1 class="banner-heading">Plan a new route</h1>
        </header>

        <main class="activity-select">
            <h2 class="select-title">Select Activity Type</h2>

            <div class="act-list">

                <!-- Walking -->
                <a class="act-card walking" href="routes3-customise-routes.html">
                    <div class="act-icon">
                        <span class="flipped-activity-icon" aria-hidden="true">🚶</span>
                    </div>
                    <div class="act-info">
                        <h3>Walking</h3>
                        <div class="act-rewards">
                            <span class="reward-chip">+ 10
                                 <span class="points-icon-crop" aria-hidden="true">
                                    <img src="images/dog-points-icon.svg" alt="dog points">
                                </span>
                            </span>
                            <span class="reward-chip">+10 xp</span>
                        </div>
                    </div>
                    <svg class="act-chevron" viewBox="0 0 24 24" width="22" height="22" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5l7 7-7 7" />
                    </svg>
                </a>

                <!-- Running -->
                <a class="act-card running" href="under-construction-activity-select1.html">
                    <div class="act-icon">
                        <span class="flipped-activity-icon" aria-hidden="true">🏃</span>
                    </div>
                    <div class="act-info">
                        <h3>Running</h3>
                        <div class="act-rewards">
                            <span class="reward-chip reward-points">+ 15
                                <span class="points-icon-crop" aria-hidden="true">
                                    <img src="images/dog-points-icon.svg" alt="dog points">
                                </span>
                            </span>
                            <span class="reward-chip">+15 xp</span>
                        </div>
                    </div>
                    <svg class="act-chevron" viewBox="0 0 24 24" width="22" height="22" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5l7 7-7 7" />
                    </svg>
                </a>

                <!-- Hiking -->
                <a class="act-card hiking" href="under-construction-activity-select1.html">
                    <div class="act-icon">
                        <span aria-hidden="true">🥾</span>
                    </div>
                    <div class="act-info">
                        <h3>Hiking</h3>
                        <div class="act-rewards">
                            <span class="reward-chip">+ 30
                                 <span class="points-icon-crop" aria-hidden="true">
                                    <img src="images/dog-points-icon.svg" alt="dog points">
                                </span>
                            </span>
                            <span class="reward-chip">+25 xp</span>
                        </div>
                    </div>
                    <svg class="act-chevron" viewBox="0 0 24 24" width="22" height="22" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5l7 7-7 7" />
                    </svg>
                </a>

            </div>

            <p class="act-note">*Maximum of 40 pts daily</p>

            <!-- AI Disclosure Footer -->
            <div id="site-footer"></div>
        </main>

        <div id="site-nav"></div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
