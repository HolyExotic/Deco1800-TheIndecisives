<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/home.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app">
    <header class="top-banner">
      <h1 class="home-header-text">
        DogGo
      </h1>

      <div class="points-counter">
        <img src="images/points_icon.svg" alt="points icon">
        <p>940</p>
      </div>
      
    </header>

    <h1 class="welcome-text"> Good Morning, User </h1>

    <div class="temperature-card">
      <div class="temp-card-top-row">
        <img class= "sunny-icon" src="images/sunny.svg" alt="sunny icon">
        <h2>24°C</h2>

        <div class="streak-counter">
          <img src="images/fire_streak.svg" alt="fire streak icon">
          <p>8</p>
        </div>

      </div>

      <hr>

      <div class="temp-card-bottom-row">
        <p>Ready to explore?</p>
        <div class="plan-route-button">
          <a href="route-planner.html" class="plan-route-button">Plan a New Route</a>
          <img src="images/right-arrow.svg" alt="right arrow icon">
        </div>

      </div>
    </div>

    <h2 class="home-headings">Quests</h2>

    <div class="quests-card">
      <div class="quest-1">
        <h3 class="quest-title">Walk 10km</h3>

        <div class="progress-bar-row">
          <div class="progress-container1">
            <div class="progress-bar1"></div>
          </div>

          <div class="quest-reward">
            <img src="images/points_icon.svg" alt="points icon">
            <p>+30</p>
          </div>
        </div>

        <p class="quest-progress">6.2 / 10km</p>
      </div>

      <hr>

      <div class="quest-1">
        <h3 class="quest-title">Walk 2 new routes</h3>
      
        <div class="progress-bar-row">
          <div class="progress-container1">
            <div class="progress-bar1 quest2-bar"></div>
          </div>
      
          <div class="quest-reward">
            <img src="images/points_icon.svg" alt="points icon">
            <p>+15</p>
          </div>
        </div>
      
        <p class="quest-progress quest2-progress">1 / 2</p>
      </div>
    </div>





    <div id="site-nav"></div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
