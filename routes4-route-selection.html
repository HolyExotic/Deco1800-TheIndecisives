<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Selection</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/routes4-route-selection.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="top-banner">
            <a class="back-link" href="routes3-customise-routes.html" aria-label="Back to customise route">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
                     stroke="#fff" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 5l-7 7 7 7" />
                </svg>
            </a>
            <h1 class="banner-heading">Route Selection</h1>
        </header>

        <main class="route-results">
            <nav class="breadcrumbs" aria-label="Breadcrumb">
                <a href="routes2-activity-selection.html">Walking</a>
                <span aria-hidden="true">‹</span>
                <a href="routes3-customise-routes.html">Customise</a>
                <span aria-hidden="true">‹</span>
                <span aria-current="page">Route Selection</span>
            </nav>

            <h2 id="results-heading">Routes Found</h2>
            <section id="route-list" class="route-list" aria-live="polite"></section>
        </main>

        <div id="site-footer"></div>
        <div id="site-nav"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/routes-data.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const preferences = params.getAll("preferences");
        const duration = params.get("duration") || "normal";
        const routeType = params.get("routeType") || "Loop";

        // Carry the customise choices through to the details page
        const carry = new URLSearchParams(window.location.search);
        carry.delete("route");
        const carryString = carry.toString() ? "&" + carry.toString() : "";

        function durationScore(route) {
            if (duration === "short") return route.minutes <= 25 ? 2 : 0;
            if (duration === "long") return route.minutes >= 60 ? 2 : 0;
            return route.minutes >= 30 && route.minutes <= 60 ? 2 : 0;
        }

        function scoreRoute(route) {
            const matchingTags = route.tags.filter(tag =>
                preferences.some(pref => pref.toLowerCase() === tag.toLowerCase())
            ).length;

            return matchingTags * 10 + durationScore(route);
        }

        const results = [...ROUTES]
            .sort((a, b) => scoreRoute(b) - scoreRoute(a))
            .slice(0, 3);

        const headingType = routeType === "Out and back" ? "Out and Back" : "Loop";
        document.getElementById("results-heading").textContent =
            `${results.length} ${headingType} Routes Found`;

        function routeMap(points) {
            const pointsString = points.map(point => point.join(",")).join(" ");
            const [endX, endY] = points[points.length - 1];
            const shape = routeType === "Loop" ? "polygon" : "polyline";

            return `
                <svg class="route-map" viewBox="0 0 80 80" aria-hidden="true">
                    <${shape} points="${pointsString}"></${shape}>
                    <circle cx="${endX}" cy="${endY}" r="4" />
                </svg>`;
        }

        document.getElementById("route-list").innerHTML = results.map(route => {
            const displayName = routeType === "Out and back"
                ? route.name.replace(/\s+Loop\b/i, "")
                : route.name;
            const href = `routes5-route-details.html?route=${ROUTES.indexOf(route)}${carryString}`;

            return `
                <a class="route-card" href="${href}" aria-label="View ${displayName} details">
                    <div class="route-map-wrap">${routeMap(route.points)}</div>
                    <div class="route-details">
                        <h3>${displayName}</h3>
                        <p class="route-meta">${route.minutes} min&nbsp;&nbsp; ${route.km.toFixed(1)} km</p>
                        <div class="route-tags">
                            ${route.tags.map(tag => `<span>${tag}</span>`).join("")}
                        </div>
                    </div>
                </a>`;
        }).join("");
    </script>
</body>

</html>
