<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dog Walking Map</title>

  <!-- Link to Leaflet CSS for built-in map components -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- link to map CSS -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/map.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="app">
    <header class="map-header">
      <button class="icon-button" id="filterButton" aria-label="Filter">
        <img src="images/filter.svg" alt="" />
      </button>

      <div class="header-text">
        <h2 class="banner-heading">Map</h2>
      </div>

      <button class="icon-button" id="searchButton" aria-label="Search">
        <img src="images/search.svg" alt="" />
      </button>
      
      <!-- Display active filters -->
      <div id="activeFilters" class="active-filters">
        🐾 Off-leash · 🌳 Parks · 〰 Trails · ⛲ Fountains
      </div>
    </header>

    <!-- Search panel -->
    <div id="searchPanel" class="search-panel hidden">
      <input type="search" id="searchInput" placeholder="Search parks or suburbs" />
      <div id="searchResults"></div>
    </div>

    <!-- using filter panel control which datasets are displayed on the map.
            Hidden by default and is controlled through map.js -->
    <div id="filterPanel" class="filter-panel hidden">
      <div class="filter-title">
        <h2>Filter Map</h2>
        <button id="resetFilters">Reset</button>
      </div>

      <!-- Dog off-leash area filter -->
      <div class="filter-row">
        <span>🐾 Off-leash areas</span>
        <label class="switch">
          <input type="checkbox" id="offLeashToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Park filter -->
      <div class="filter-row">
        <span>🌳 Parks</span>
        <label class="switch">
          <input type="checkbox" id="parkToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Walking trail filter -->
      <div class="filter-row">
        <span>〰 Walking trails</span>
        <label class="switch">
          <input type="checkbox" id="trailToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Drinking fountain filter -->
      <div class="filter-row">
        <span>⛲ Drinking fountains</span>
        <label class="switch">
          <input type="checkbox" id="fountainToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Apply the selected dataset filters to the map -->
      <button id="applyFilters" class="apply-button">Apply</button>
    </div>
    <main id="map"></main>

    <!-- Button to get the user's current location -->
    <button id="useMyLocationButton" class="use-location-button" type="button">
      Use My Location
    </button>

    <!-- showing location details when a map location is selected -->
    <div id="locationDetails" class="location-details hidden">
      <div class="location-details-header">
        <h2 id="locationTitle">Location Name</h2>
        <button id="closeLocationDetails">X</button>
      </div>
      <p id="locationSuburb"></p>
      <p id="locationInfo"></p>
      
      <!-- Open Google Maps walking directions -->
      <button id="getDirectionsButton" class="route-button" type="button">
          Get Walking Directions
      </button>
      <p class="external-map-note">
          Opens Google Maps in a new tab.
      </p>
    </div>

    <!-- AI Disclosure Footer -->
    <div id="site-footer"></div>

    <div id="site-nav"></div>
  </div>

  <!-- Load the Leaflet JavaScript library, this provides map functions -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script src="js/map.js"></script>
</body>

</html>
