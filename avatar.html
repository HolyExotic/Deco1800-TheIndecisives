<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avatar</title>

        <!-- Google Fonts -->
  <link rel="stylesheet" href="css/customisation.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/avatar.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
    
    <link rel="images" href="images/" >
     
</head>
<body>

    <div class="app">
            <header class="top-banner">
                <h1 class="title", style = "font-size: 25px; padding: 20px;" > Home </h1>
            </header>

        <main id = "mainScreen" class = "avatar-home">
        
            <h2> Welcome Back! </h2>

        <!-- Buttons over dog -->
        <div class="avatar-menu1">
            <button class="dog-avatar-selection">

                <img
                    src = "images/avatar.selection.btn.png", style = "max-width: 110px; height: auto;"
                    alt = "Dog Avatars"
                />
            </button>

        </div>
        
        <div class="avatar-menu2">
            <button class="dog-accessories">

                <img
                    src = "images/accessories.customise.btn.png", style = "max-width: 110px; height: auto;"
                    alt = "Dog Accessories"
                />
            </button>
        </div>

        <div class="avatar-menu3">
            <button class="daily-quests">

                <img
                    src = "images/quests.btn.png", style = "max-width: 110px; height: auto;"
                    alt = "Quests"
                />
            </button>
        </div>    
        
            <div class = "avatar-container">
                <div class = "avatar-image">
                    <img src = "images/dog.small.png" alt = "A stylized small dog avatar facing forward with a calm expression, centered on a simple background, as the main subject in a dog customization screen" style="max-width: 200px; height: auto;" />
                </div>

                <div class = "worn-accessory"> </div>
            </div>

        <div class = "shadow">
            <img src = "images/dog.shadow.png" alt = "The dog's shadow", style="max-width: 250px; height: auto;" />
        </div>

        <div class="DogGo-btn"> 
            <button class = "lower-btn"> DogGo! </button> 
        </div>

        <div class = "buble-shadow1">
            <img src = "images/bubble.shadow.png" alt = "bubble shadow" style = "max-width: 110px; height: auto;" />
        </div> 

        <div class = "buble-shadow2">
            <img src = "images/bubble.shadow.png" alt = "bubble shadow" style = "max-width: 110px; height: auto;" />
        </div> 

        <div class = "buble-shadow3">
            <img src = "images/bubble.shadow.png" alt = "bubble shadow" style = "max-width: 110px; height: auto;" />
        </div> 
        

    </main>
    
    <div id="site-nav"></div>
    <script src="js/script.js"></script>
    <script src="js/avatar.js"></script>

</body>
</html>
