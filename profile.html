<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/profile.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="top-banner">
            <h1 class="banner-heading">Profile</h1>
        </header>

        <main class="profile">
            <div class="profile-card">
                <div class="profile-info">
                    <img class="avatar" src="images/dog_profile_pic.png" alt="Max" />
                    <div class="details">
                        <h2 class="dog-name">Max</h2>
                        <p class="rank">Novice Explorer</p>
                        <p>Age: 7</p>
                        <p>Size: Medium</p>
                        <p>Weight: 36kg</p>
                    </div>
                </div>

                <div class="level">
                    <span class="level-label">Level 4</span>
                    <div class="xp-bar">
                        <div class="xp-fill" style="width: 68%"></div>
                    </div>
                    <p class="xp-text">34 / 50xp</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <h3>Streak</h3>
                    <div class="stat-row fire_streak_icon">
                        <img src="images/fire_streak2.svg" alt="fire streak2 icon">
                        <span class="stat-number">11</span>
                    </div>
                </div>

                <div class="stat">
                    <h3>Status</h3>
                    <img src="images/pulse.svg" alt="pulse icon">
                    <span class="stat-sub">Active</span>
                </div>

                <div class="stat">
                    <h3>Activities Completed</h3>
                    <span class="stat-number">14</span>
                </div>

                <div class="stat">
                    <h3>Total Active Time</h3>
                    <span class="stat-number small">19 hrs</span>
                </div>
            </div>

            <section class="activity">
                <h2 class="activity-title">Activity</h2>
                <div class="activity-card">
                    <div class="activity-header">
                        <button class="period-btn" id="period-btn" aria-expanded="false">
                            <span id="period-label">This Week</span>
                            <svg width="16" height="16" viewBox="0 0 16 16" stroke="#000" stroke-width="2"
                                stroke-linecap="round">
                                <line x1="1" y1="3" x2="15" y2="3" />
                                <line x1="3" y1="8" x2="13" y2="8" />
                                <line x1="6" y1="13" x2="10" y2="13" />
                            </svg>
                        </button>
                        <ul class="period-menu" id="period-menu" hidden>
                            <li data-period="week">This Week</li>
                            <li data-period="month">This Month</li>
                        </ul>
                    </div>

                    <div class="chart" id="chart-week" style="--max:60">
                        <div class="bar-col">
                            <div class="bar" style="--min:60" title="60 min"></div><span>S</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:0" title="0 min"></div><span>M</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:13" title="13 min"></div><span>T</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:24" title="24 min"></div><span>W</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:7" title="7 min"></div><span>T</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:33" title="33 min"></div><span>F</span>
                        </div>
                        <div class="bar-col">
                            <div class="bar" style="--min:55" title="55 min"></div><span>S</span>
                        </div>
                    </div>

                    <div class="calendar" id="chart-month" hidden></div>
                </div>
            </section>

            <section class="preferences">
                <h2 class="activity-title">Preferences</h2>
                <div class="pref-list">
                    <span class="pref-chip">Quiet</span>
                    <span class="pref-chip">Greenery</span>
                    <span class="pref-chip">Drinking Stations</span>
                </div>
            </section>
        </main>

        <div id="site-nav"></div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
