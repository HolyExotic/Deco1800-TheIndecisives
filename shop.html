<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="app">
      <!-- Points header -->
      <section class="points-section">
        <h2>You have</h2>
        <div id="points-number">940</div>
        <div id="points-label">points</div>
      </section>

      <!-- Feature buttons -->
      <div class="CCs">
        <div class="CCs-button">
          <div class="CCs-icon">
            <img src="images/coupons.svg" alt="Coupons" />
          </div>
          <span>Coupons</span>
        </div>

        <a href="customisation.html" class="CCs-button">
          <div class="CCs-icon">
            <img src="images/customisation.svg" alt="Customisation" />
          </div>
          <span>Customisation</span>
        </a>
      </div>
      <!-- Featured offers -->
      <section class="featured">
        <div id="featured-title">Featured</div>

        <div class="offer-card">
          <div class="offer-image">
            <img src="images/halloween.svg" alt="Halloween" />
          </div>

          <div class="offer-content">
            <div class="offer-title">Limited edition Halloween drop!</div>

            <div class="offer-bottom">
              1/10 - 1/11
              <span class="arrow">↪</span>
            </div>
          </div>
        </div>

        <div class="offer-card">
          <div class="offer-image">
            <img src="images/dog_treat.svg" alt="Dog Treat" />
          </div>

          <div class="offer-content">
            <div class="offer-title">Brand_Name_1</div>

            <div class="offer-subtitle">5% off dog treats!</div>

            <div class="offer-bottom">
              1 day only
              <span class="arrow">↪</span>
            </div>
          </div>
        </div>
      </section>

      <!-- MARK: Bottom nav -->
      <div id="site-nav"></div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
