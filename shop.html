<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewards App</title>
    <link rel="stylesheet" href="css/shop.css" />
  </head>

  <body>
    <div class="app">
      <!-- Points header -->
      <section class="points-section">
        <h2>You have</h2>
        <div id="points-number">940</div>
        <div id="points-label">points</div>
      </section>

      <!-- Feature buttons -->
      <div class="CCs">
        <div class="CCs-button">
          <div class="CCs-icon">
            <img src="images/coupons.svg" alt="Coupons" />
          </div>
          <span>Coupons</span>
        </div>

        <div class="CCs-button">
          <div class="CCs-icon">
            <img src="images/customisation.svg" alt="Customisation" />
          </div>
          <span>Customisation</span>
        </div>
      </div>
      <!-- Featured offers -->
      <section class="featured">
        <div id="featured-title">Featured</div>

        <div class="offer-card">
          <div class="offer-image">
            <img src="images/halloween.svg" alt="Halloween" />
          </div>

          <div class="offer-content">
            <div class="offer-title">Limited edition Halloween drop!</div>

            <div class="offer-bottom">
              1/10 - 1/11
              <span class="arrow">↪</span>
            </div>
          </div>
        </div>

        <div class="offer-card">
          <div class="offer-image">
            <img src="images/dog_treat.svg" alt="Dog Treat" />
          </div>

          <div class="offer-content">
            <div class="offer-title">Brand_Name_1</div>

            <div class="offer-subtitle">5% off dog treats!</div>

            <div class="offer-bottom">
              1 day only
              <span class="arrow">↪</span>
            </div>
          </div>
        </div>
      </section>

      <!-- MARK: Bottom nav -->
      <nav class="bottom-nav">
        <!--HOME-->
        <div class="nav-item">
          <div class="nav-icon">
            <img src="images/home.svg" alt="Home" />
          </div>
          <span>Home</span>
        </div>

        <!--ROUTES-->
        <div class="nav-item">
          <div class="nav-icon">
            <img src="images/routes.svg" alt="Routes" />
          </div>
          <span>Routes</span>
        </div>

        <div class="add-button">+</div>

        <!--SHOP-->
        <div class="nav-item">
          <div class="nav-icon">
            <img src="images/shop.svg" alt="Shop" />
          </div>
          <span>Shop</span>
        </div>

        <!--PROFILE-->
        <div class="nav-item">
          <div class="nav-icon">
            <img src="images/profile.svg" alt="Profile" />
          </div>
          <span>Profile</span>
        </div>
      </nav>
    </div>
  </body>
</html>
