<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <!-- Points header -->
      <section class="points-section">
        <h2>You have</h2>

        <div id="points-number" class="points-balance">940</div>

        <div id="points-label">points</div>
      </section>

      <!-- Feature buttons -->
      <div class="CCs">
        <!-- Coupons -->
        <a href="coupons.html" class="CCs-button">
          <div class="CCs-icon">
            <img src="images/coupons.svg" alt="Coupons" />
          </div>
          <span>Coupons</span>
        </a>

        <!-- Customisation -->
        <a href="customisation.html" class="CCs-button">
          <div class="CCs-icon">
            <img src="images/customisation.svg" alt="Customisation" />
          </div>
          <span>Customisation</span>
        </a>
      </div>

      <div class="shop-art">
        <img
          src="images/customisation-dogs-artistic.png"
          class="make-pretty"
          style="max-width: 600px"
        />
      </div>

      <!-- AI Disclosure Footer -->
      <div id="site-footer"></div>

      <!-- MARK: Bottom nav -->
      <div id="site-nav"></div>
    </div>
    <script src="js/script.js"></script>
    <script src="js/points.js"></script>
  </body>
</html>
