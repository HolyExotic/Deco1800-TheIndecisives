<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Customisation</title>
</head>
<link rel="stylesheet" href="css/customisation.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="css/avatar.css" />
<link rel="stylesheet" href="css/accessories.customise.css" />
<link rel="images" href="images/">

<body>
    <div class="app">
        <header class="top-banner">

            <a href=" index.html" class="back-button" , style="padding: 10px; margin-top: -24px;">
                <img src="images/back_button.svg" alt="back button" /></a>

            <h1 class="title" , style="font-size: 20px; padding: 10px;"> Accessories Customisation </h1>
        </header>

        <main id="mainScreen" class="Accessories-customisation">

            <div class="Dog-name-input">
                <input type="text" class="input-name" 
                data-avatar-name 
                placeholder="Avatar Name">
            </div>

            <div class="avatar-container">
                <div class="avatar-image">
                    <img src="images/dog.small.png"
                        data-avatar-image />
                </div>

                <div class="worn-accessory"> </div>
            </div>

            <div class="shadow">
                <img src="images/dog.shadow.png" alt="The dog's shadow" , style="max-width: 250px; height: auto;" />
            </div>

            <div class = "back-shadow">
                    <img src="images/bubble.shadow.png", style = "max-width: 110px; height: auto"/>
            </div>

            <div class = "view-accessories">
                <button class = "hanger">
                    <img src = "images/accessories.customise.btn.png", style = "max-width: 110px; height: auto" />
                </button>

            </div>

        </main>
        
    <section class="inventory" id="inventory" style="display:none"
         aria-label="My Outfits">

        <div class="inventory-title">
            <h2>My Outfits</h2>
            <button class="close-inventory"> × </button>
        </div>

        <a href="shop.html" class="shop-more">
            Shop For More <img src = "images/shop.icon.grey.png" class="shop-icon"/>
        </a>
        
        <div class="outfit-options">

            <button class="Remove-accessory" data-accessory="none">
                <span class="no-accessory-icon">
                    <img src = "images/accessories.none.png" class="item", style="max-height:auto; max-width:48px;" />
                </span>
            </button>

            <button
                class="outfit-item"
                data-accessory="cowboyhat"
            >
                <img src="images/cowboy_hat.svg" class="item">
            </button>

            <button
                class="outfit-item"
                data-accessory="partyhat"
                aria-label="Party hat"
            >
                <img src="images/party_hat.svg" class="item"/>
            </button>

            <button
                class="outfit-item"
                data-accessory="bow"
                aria-label="Red bow"
            >
                <img src="images/red_bow.svg" class="item">
            </button>

            <button
                class = "outfit-item"
                data-accessory="glasses"
                aria-label="Glasses"
            >
                <img src="images/glasses.svg" class="item"/>
            </button>

            <button
                class="outfit-item"
                data-accessory="sunglasses"
                aria-label="Sun-glasses"
            >

                <img src="images/sunglasses.svg" class="item"/>
            </button>

        </div>

        <button class="save-button">
            Save Changes
        </button>

    </section>


            <div id="site-nav"></div>

    </div>


    <script src="js/script.js"></script>
    <script src="js/avatar.settings.js"></script>
    <script src="js/avatar.js"></script>
    <script src="js/accessories.customise.js"></script>

</body>

</html>
