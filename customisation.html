<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customisation</title>
    <link rel="stylesheet" href="css/customisation.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="customisation-header">
        <a href="shop.html" class="back-button" ><img src="images/back_button.svg" alt="back button"></a>

        <h1>Customisation</h1>
      </header>

      <!-- Customisation Content -->
      <main class="customisation-content">
        <p class="profile-note">*Items can be viewed in your Profile</p>

        <!-- Cowboy Hat -->
        <div class="item-card">
          <div class="item-image">
            <img src="images/cowboy-hat.png" alt="Cowboy Hat" />
          </div>

          <div class="item-info">
            <h2>Cowboy Hat</h2>
            <p>Halloween Event Item</p>
          </div>

          <div class="points">
            <span>30</span>
            <span>points</span>
          </div>
        </div>

        <!-- Glowing Dog Collar -->
        <div class="item-card">
          <div class="item-image">
            <img src="images/glowing-dog-collar.png" alt="Glowing Dog Collar" />
          </div>

          <div class="item-info">
            <h2>Glowing Dog Collar</h2>
            <p>Limited time Lights festival item</p>
            <p>25.10.2026</p>
          </div>

          <div class="points">
            <span>150</span>
            <span>points</span>
          </div>
        </div>

        <!-- Red Bow -->
        <div class="item-card">
          <div class="item-image">
            <img src="images/red-bow.png" alt="Red Bow" />
          </div>

          <div class="item-info">
            <h2>Red Bow</h2>
            <p>Permanent</p>
          </div>

          <div class="points">
            <span>110</span>
            <span>points</span>
          </div>
        </div>
      </main>
      <div id="site-nav"></div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
