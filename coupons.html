<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coupons</title>
    <link rel="stylesheet" href="css/coupons.css" />
    <link rel="stylesheet" href="css/customisation.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <!-- Header -->
      <header class="top-banner">
        <a href="shop.html" class="back-link" aria-label="Back to shop">
          <svg
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="none"
            stroke="#fff"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </a>

        <h1>Coupons</h1>

        <div class="points-counter">
          <img src="images/dog-points-icon.svg" alt="Points" />
          <span class="points-counter-value">
            <span class="points-balance">940</span>
          </span>
        </div>
      </header>

      <!-- Coupon content -->
      <main class="coupon-content">
        <p class="limit-note">*Limit of 5 per month</p>

        <section class="coupon-list">
          <article class="coupon-card">
            <div class="coupon-icon">
              <img src="images/treats.svg" alt="Dog treats" />
            </div>

            <div class="coupon-details">
              <h2>Brand_Name_1</h2>
              <p>5% off dog treats!</p>
              <span>1 day only</span>
            </div>

            <div class="points-panel">
              <strong>30</strong>
              <span>points</span>
            </div>
          </article>

          <article class="coupon-card">
            <div class="coupon-icon">
              <img src="images/accessories.svg" alt="Dog accessories" />
            </div>

            <div class="coupon-details">
              <h2>Brand_Name_2</h2>
              <p>5% off dog accessories!</p>
              <span>5.9 - 19.9</span>
            </div>

            <div class="points-panel">
              <strong>50</strong>
              <span>points</span>
            </div>
          </article>

          <article class="coupon-card">
            <div class="coupon-icon">
              <img src="images/toys.svg" alt="Dog toys" />
            </div>

            <div class="coupon-details">
              <h2>Brand_Name_3</h2>
              <p>10% off dog toys!</p>
              <span>15.9 - 29.9</span>
            </div>

            <div class="points-panel">
              <strong>110</strong>
              <span>points</span>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="js/script.js"></script>
    <script src="js/points.js"></script>

  </body>
</html>
